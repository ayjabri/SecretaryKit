[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicekit"
version = "0.2.0"
description = "Talk to any AI agent by voice: local Whisper speech-to-text and Kokoro text-to-speech, with adapters for Ollama, OpenAI-compatible servers, Claude, LangGraph and LangChain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "webrtcvad-wheels>=2.0.11",
    "faster-whisper>=1.1",
    "kokoro>=0.9.4",
    "huggingface_hub>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# CUDA libraries for faster-whisper on Windows/Linux GPUs.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]
# ClaudeAgent
claude = ["anthropic>=1.0"]
# LangGraphAgent / LangChainAgent (+ ChatOllama for local models)
langgraph = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
]
all = ["voicekit[cuda,claude,langgraph]"]

[tool.setuptools]
packages = ["voicekit", "voicekit.agents"]
